<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Туристична агенція{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header class="header">
        <div class="container header-container">
            <a href="{{ url_for('index') }}" class="logo">Mandra<b>Travel</b></a>
            <button id="menu-toggle" class="menu-toggle" aria-label="Відкрити меню">☰</button>
            <nav id="main-nav" class="nav">
                <ul>
                    <li><a href="{{ url_for('index') }}">Головна</a></li>
                    <li><a href="{{ url_for('about') }}">Про нас</a></li>
                    <li><a href="{{ url_for('tours') }}">Тури</a></li>
                    <li><a href="{{ url_for('add_tour') }}">Додати тур</a></li>
                    <li><a href="{{ url_for('gallery') }}">Галерея</a></li>
                    <li><a href="{{ url_for('contacts') }}">Контакти</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-content container">
        {% block content %}{% endblock %}
    </main>

    <!-- Лайтбокс для збільшення зображень у галереї -->
    <div id="lightbox" class="lightbox">
        <span class="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="Збільшене фото">
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Туристична агенція MandraTravel. Усі права захищені.</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
